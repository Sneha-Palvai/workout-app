<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning Strength">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Morning Strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F7;--card:#FFFFFF;--ink:#1C2430;--muted:#5B6676;--line:#DCE1E7;--soft:#EDF0F3;--teal:#0E6B65;--teal-soft:#DDEFEC;--sun:#C9681F;--sun-soft:#FBE9D9;--bad:#B23E2C;--bad-soft:#F8E0DA;--on-teal:#FFFFFF;--fig:#1C2430;
--disp:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151B;--card:#192028;--ink:#E7ECF1;--muted:#9AA5B3;--line:#2B343F;--soft:#212A34;--teal:#4DB6AC;--teal-soft:#173431;--sun:#F0A25E;--sun-soft:#3A2717;--bad:#E8907E;--bad-soft:#3B1E18;--on-teal:#08201D;--fig:#E7ECF1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151B;--card:#192028;--ink:#E7ECF1;--muted:#9AA5B3;--line:#2B343F;--soft:#212A34;--teal:#4DB6AC;--teal-soft:#173431;--sun:#F0A25E;--sun-soft:#3A2717;--bad:#E8907E;--bad-soft:#3B1E18;--on-teal:#08201D;--fig:#E7ECF1;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 104px}
.wrap.sess{padding-bottom:40px}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;margin:0}
.h1{font-size:28px;line-height:1.15}
.h2{font-size:24px;line-height:1.15}
h3{font-size:19px;margin:0 0 6px}
.big{font-size:60px;line-height:.95;margin:2px 0 0}
.hname{font-family:var(--disp);font-size:23px;font-weight:500;margin:6px 0 2px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px}
.card.note{border-color:var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.out-bad{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.sun{background:var(--sun-soft);color:var(--sun);font-weight:600}
.seg{display:flex;gap:6px;margin:16px 0 6px}
.seg span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg span.on{background:var(--sun)}
.plan{margin:16px 0;padding:0 0 0 22px}
.plan li{margin:8px 0;padding-left:2px}
.plan li span{display:block;color:var(--muted);font-size:14px}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 0 14px}
.tog input{width:22px;height:22px;accent-color:var(--teal);margin:0}
.opt{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:14px 0;font-weight:600;font-size:16px}
.opt.first{border-top:0}
.opt span{display:block;font-weight:400;color:var(--muted);font-size:14px}
.wlist{margin:4px 0 0;padding:0;list-style:none}
.wlist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border:0;border-radius:12px;padding:12px 14px;margin:6px 0;text-align:left;font-size:15px}
.wlist em{font-style:normal;color:var(--teal);font-size:13px;font-weight:600}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.sbar p{text-align:center;flex:1}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 6px}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex.first{border-top:0;padding-top:4px}
.row{display:flex;align-items:center;gap:6px}
.ck{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;flex:none;padding:0;color:transparent;margin-right:4px}
.ck.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.ck.ghost{visibility:hidden}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;padding:0}
.ib:active,.ib.on{background:var(--teal-soft);color:var(--teal)}
.info{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px;line-height:1.3}
.done .nm{text-decoration:line-through;color:var(--muted)}
.skp .nm{color:var(--muted)}
.amt{margin:2px 0 0;font-size:15px;font-weight:600;color:var(--teal)}
.skp .amt{color:var(--muted)}
.sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.st{margin:4px 0 0;font-size:14px;color:var(--muted)}
.st a{color:var(--teal);font-weight:600}
.tmv{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sun);font-size:15px;min-width:40px;text-align:right}
.panel{margin:10px 0 0 42px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px}
.panel .btns{margin-top:8px}
.wrow{display:flex;align-items:center;gap:8px;margin:10px 0 0 42px;font-size:14px;color:var(--muted)}
input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px}
input[type=number]{width:84px;height:42px}
textarea{width:100%;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.demo{margin:12px 0 0;background:var(--soft);border-radius:16px;padding:12px 14px 14px}
.lbl{text-align:center;font-weight:600;font-size:15px;min-height:22px;margin:0 0 4px}
.lbl.ok{color:var(--teal)}
.lbl.bad{color:var(--bad)}
.fig{display:block;width:100%;max-width:320px;margin:0 auto}
.fig .limb{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
.fig .to{stroke-width:7}
.fig .far{opacity:.38}
.fig.front .far{opacity:1}
.fig .hd{fill:var(--fig)}
.fig .fp{fill:var(--card);stroke:var(--muted);stroke-width:1}
.fig .fl{stroke:var(--muted)}
.fig .cb{stroke:var(--muted);stroke-width:1.2}
.fig .dbb{fill:var(--sun)}
.fig .bar{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.fig .gd{stroke-width:1.5;fill:none}
.fig .bk{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cues{margin:10px 0 0;padding-left:18px;font-size:14px}
.cues li{margin:2px 0}
.avoid{color:var(--bad);font-size:14px;margin:8px 0 0}
.err{color:var(--bad);font-size:14px;min-height:21px;margin:8px 0 0;text-align:center}
.rest{text-align:center;padding:28px 0 8px}
.timer{font-family:var(--disp);font-size:96px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 10px}
.rest .btns{justify-content:center}
.nextl{margin:16px auto 0;max-width:320px;text-align:left;font-size:15px;padding-left:20px}
.gl{list-style:none;margin:12px 0;padding:0}
.gl li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px}
.gl li.cur{background:var(--sun-soft)}
.gl li.dn{opacity:.55}
.gl li b{display:block;font-weight:600}
.gl li span{font-size:14px;color:var(--muted)}
.gl .tv{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--sun)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.mini .v{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.2}
.dots{display:flex;gap:5px;margin-top:6px}
.dots span{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted)}
.dots span.on{background:var(--teal);border-color:var(--teal)}
.mhd{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.dw{font-size:12px;color:var(--muted);padding:4px 0}
.dc{border:0;background:transparent;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:12px;min-height:54px}
.dn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1.5px solid transparent}
.dc.full .dn{background:var(--teal);color:var(--on-teal);font-weight:700}
.dc.part .dn{border:1.5px dashed var(--teal);color:var(--teal);font-weight:700}
.dc.today .dn{box-shadow:0 0 0 2px var(--sun)}
.dc.sel{background:var(--soft)}
.dc.fut .dn{color:var(--muted)}
.kc{font-size:10px;color:var(--sun);line-height:1.2;min-height:12px;font-weight:600}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0 4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.entry{padding:12px 0;border-top:1px solid var(--line)}
.entry.first{border-top:0;padding-top:4px}
.krow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
label.fld{display:block;font-weight:600;margin:16px 0 6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar.hide{display:none}
.tab{flex:1;max-width:150px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:12px}
.tab.on{color:var(--teal);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections">

<button class="tab" data-tab="cal"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
<button class="tab" data-tab="set"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ===================== YOUR WORKOUT PLAN =====================
   Everything about the plan lives in this section: exercises,
   workouts, warm-up, cool-down and progression rules.

// Cardio warm-up circuit that opens every workout (seconds per move)
var CARDIO = {name:'Cardio warm-up', cardio:1, items:[['jj',30],['hk',30],['bk',30],['sk',30]]};

// The 5 workouts, done in order. Numbers are reps, or seconds for timed moves.
var WORKOUTS = [
  {n:'Full body', min:'35 to 40 min', c:[

    {name:'Strength', items:[['rdl',10],['kpu',8],['sp',10]]},
    {name:'Core', items:[['plank',30],['dbug',8]]}]},
  {n:'Upper body and core', min:'35 to 40 min', c:[
    CARDIO,
    {name:'Back and chest', main:1, items:[['lpd',12],['idp',10],['fpull',12]]},
    {name:'Back and arms', items:[['csr',10],['lr',12],['curl',10],['tpd',12]]},
    {name:'Core', items:[['rc',10],['sidepk',20]]}]},
  {n:'Full body circuit', min:'30 to 35 min', c:[

    {name:'Stamina', items:[['gb',15],['fw',30],['mc',20]]},
    {name:'Core', items:[['kst',10],['bcr',10]]}]},
  {n:'Conditioning and core', min:'35 to 40 min', c:[

    {name:'Bike intervals', fixed:1, items:[['bike',540]]},
    {name:'Bodyweight', main:1, items:[['kpu',8],['bpb',5],['sup',20]]},
    {name:'Core', items:[['dbug',8],['pal',10],['plank',30]]}]},
  {n:'Lower body and core', min:'35 to 40 min', c:[
    CARDIO,
    {name:'Legs', main:1, items:[['gob',12],['ht',12],['su',8]]},
    {name:'Legs', items:[['rdl',10],['rl',8],['ws',30]]},
    {name:'Core', items:[['cr',12],['llr',8],['bd',8]]}]}
];

// Gentle session for period days
var PERIOD = [
  {name:'Gentle cardio', fixed:1, items:[['walk',600]]},
  {name:'Easy moves', items:[['gb',12],['bd',8]]}
];

// Optional loosen-up (seconds each) and cool-down stretches
var LOOSEN_SEC = 15, LOOSEN = [
  ['Neck tilts','Ear toward shoulder, side to side, slowly'],
  ['Shoulder rolls','Roll backward, then forward'],
  ['Arm circles','Small to big, then reverse'],
  ['Wrist circles','Both directions'],
  ['Torso twists','Feet planted, turn side to side'],
  ['Hip circles','Hands on hips, slow circles'],
  ['Knee circles','Hands on knees, small circles'],
  ['Ankle circles','One foot at a time'],
  ['Leg swings','Hold something, swing each leg front to back']];
var COOL_SEC = 40, COOL = [
  ['Hip flexor stretch','Kneel on one knee, push hips gently forward. Switch legs halfway.'],
  ['Hamstring stretch','Sit with one leg straight, reach toward your toes. Switch halfway.'],
  ['Chest stretch','Hand on a wall at shoulder height, turn your body away slowly.'],
  ['Child’s pose','Kneel, sit back on your heels, stretch your arms forward.']];
var PCOOL = [
  ['Cat-cow','On hands and knees, slowly round your back, then let it dip.'],
  ['Child’s pose','Kneel, sit back on your heels, stretch your arms forward.'],
  ['Hip flexor stretch','Kneel on one knee, push hips gently forward. Switch legs halfway.'],
  ['Knee hug','Lie on your back and hug both knees gently to your chest.']];

// Progression across cycles (1 cycle = all 5 workouts done)
function progression(cycle){
  return {
    addReps: cycle >= 2 ? 2 : 0,      // cycle 2+: +2 reps
    addSec:  cycle >= 2 ? 10 : 0,     // cycle 2+: +10 sec on holds
    mainRounds: cycle >= 3 ? 3 : 2,   // cycle 3+: 3 rounds of the first strength circuit
    rest: cycle >= 4 ? 45 : 60        // cycle 4+: shorter rest between rounds
  };
}
var CIRCUIT_REST = 90, CARDIO_REST = 30, NORMAL_ROUNDS = 2;

/* Exercise library.
   n: name, how: one-line instruction, u:'s' = timed, side: each side, rng: rep range,
   wt: has a weight box, alt: easier version, cues / av: form tips and mistake to avoid.
   K: animation keyframes (angles for the stick figure). */
var EX = {
jj:{n:'Jumping jacks',how:'Jump feet out and arms up, then back in.',u:'s',alt:'sj',front:1,sp:340,hold:0,
 K:[{an:'p',at:[80,59],U1:18,F1:12,Th1:6,S1:6},{an:'p',at:[80,55],U1:155,F1:170,Th1:20,S1:20}],
 L:['Feet together, arms down','Feet out, arms up'],
 cues:['Land softly on the balls of your feet','Keep a steady rhythm','Reach your arms all the way up'],av:'Landing hard on your heels'},
sj:{n:'Step jacks',how:'Step one foot out as your arms go up, then switch sides.',u:'s',front:1,sp:420,hold:120,
 K:[{an:'p',at:[80,59],U1:18,F1:12,U2:-18,F2:-12,Th1:3,S1:3,Th2:-3,S2:-3,Ft2:-90},
    {an:'p',at:[80,60],U1:155,F1:170,U2:-155,F2:-170,Th1:26,S1:26,Th2:-3,S2:-3,Ft2:-90},
    {an:'p',at:[80,59],U1:18,F1:12,U2:-18,F2:-12,Th1:3,S1:3,Th2:-3,S2:-3,Ft2:-90},
    {an:'p',at:[80,60],U1:155,F1:170,U2:-155,F2:-170,Th1:3,S1:3,Th2:-26,S2:-26,Ft2:-90}],
 L:['Start tall','Step out, arms up','Back to the middle','Other side'],
 cues:['Step wide and reach your arms up','Keep a brisk pace','No jumping needed'],av:'Rushing and losing your balance'},
hk:{n:'High knees',how:'Run in place, bringing your knees up to hip height.',u:'s',alt:'mh',sp:300,hold:0,
 K:[{an:'p',at:[80,58],Th1:92,S1:5,Th2:0,S2:0,Ft2:90,U1:-40,F1:45,U2:45,F2:150},
    {an:'p',at:[80,58],Th1:0,S1:0,Th2:92,S2:5,Ft2:90,U1:45,F1:150,U2:-40,F2:45}],
 L:['Knees up to hip height','Knees up to hip height'],
 cues:['Pump your arms','Stay light on the balls of your feet','Stand tall, don’t lean back'],av:'Leaning back or slouching'},
mh:{n:'Marching high knees',how:'March in place, lifting each knee high.',u:'s',sp:600,hold:150,
 K:[{an:'p',at:[80,59],Th1:75,S1:0,Th2:0,S2:0,Ft2:90,U1:-30,F1:40,U2:35,F2:130},
    {an:'p',at:[80,59],Th1:0,S1:0,Th2:75,S2:0,Ft2:90,U1:35,F1:130,U2:-30,F2:40}],
 L:['Lift one knee high','Now the other knee'],
 cues:['Lift each knee toward hip height','Swing the opposite arm','Keep a brisk pace'],av:'Rounding your back'},
bk:{n:'Butt kicks',how:'Jog in place, kicking your heels toward your bottom.',u:'s',alt:'wbk',sp:300,hold:0,
 K:[{an:'p',at:[80,58],Th1:-6,S1:-160,Ft1:-100,Th2:0,S2:0,Ft2:90,U1:-35,F1:55,U2:35,F2:125},
    {an:'p',at:[80,58],Th1:0,S1:0,Ft1:90,Th2:-6,S2:-160,Ft2:-100,U1:35,F1:125,U2:-35,F2:55}],
 L:['Heel to your bottom','Heel to your bottom'],
 cues:['Knees point down to the floor','Quick, light steps','Pump your arms'],av:'Leaning forward'},
wbk:{n:'Walking butt kicks',how:'Walk in place, bringing each heel up toward your bottom.',u:'s',sp:600,hold:150,
 K:[{an:'p',at:[80,59],Th1:-4,S1:-145,Ft1:-100,Th2:0,S2:0,Ft2:90,U1:-25,F1:40,U2:25,F2:110},
    {an:'p',at:[80,59],Th1:0,S1:0,Ft1:90,Th2:-4,S2:-145,Ft2:-100,U1:25,F1:110,U2:-25,F2:40}],

    var cur = g && g.i===i && g.run, dn = g && i<g.i;
    return '<li class="'+(cur?'cur':'')+(dn?' dn':'')+'"><div><b>'+esc(it[0])+'</b><span>'+esc(it[1])+'</span></div><span class="tv"'+(cur?' id="glv"':'')+'>'+(cur ? fmt((g.end-Date.now())/1000) : (dn ? 'Done' : sec+' sec'))+'</span></li>';
  }).join('')+'</ol>';
  if(!g || (!g.run && g.i<list.length)) h += '<button class="btn full" data-act="glStart">'+I('play',18)+' '+(g ? 'Continue timer' : 'Start guided timer')+'</button>';
  else if(g.run) h += '<div class="btns" style="margin-top:0"><button class="btn sm" data-act="glPause">Pause</button><button class="btn sm" data-act="glNext">Next stretch</button></div>';
  h += '<button class="btn pri full" style="margin-top:12px" data-act="'+btnAct+'">'+btnLabel+'</button>';
  return h;
}

function renderSess(){
  var h = '<div class="sbar"><button class="ib" data-act="leaveAsk" aria-label="Leave workout">'+I('x',22)+'</button><p class="small muted">'+esc(SS.title)+'</p><span style="width:40px"></span></div>';
  if(ui.leave) h += '<div class="panel" style="margin:0 0 14px">Leave this workout? You can resume it from the home screen.<div class="btns"><button class="btn sm" data-act="leaveYes">Leave</button><button class="btn sm pri" data-act="leaveNo">Stay</button></div></div>';
  var nC = SS.circ.length;
  if(SS.ph==='loosen'){
    h += '<section class="card">'+renderGuide(LOOSEN, LOOSEN_SEC, 'Loosen-up', 'Gentle joint circles to get moving. About 2 minutes.', 'toWorkout', 'Continue to workout')+'</section>';
  } else if(SS.ph==='go'){
    var c = SS.circ[SS.ci];
    h += '<div class="chead"><div><p class="muted small">Circuit '+(SS.ci+1)+' of '+nC+'</p><h2 class="h2">'+esc(c.name)+'</h2></div><span class="chip sun">Round '+SS.r+' of '+c.rounds+'</span></div>'
      + '<p class="muted small" style="margin-bottom:10px">'+(c.items.length>1 ? 'Do each exercise back to back, then rest.' : 'Use the timer and go at your own pace.')+'</p>'
      + '<button class="btn sm" data-act="skipCircAsk" style="margin-bottom:12px">'+I('next',16)+' Skip circuit</button>';
    if(ui.skipCirc) h += '<div class="panel" style="margin:0 0 12px">Skip the rest of this circuit?<div class="btns"><button class="btn sm pri" data-act="skipCircYes">Yes, skip</button><button class="btn sm" data-act="skipCircNo">Cancel</button></div></div>';
    h += '<section class="card">'+c.items.map(function(it,i){ return exRow(it, i, i===0); }).join('')+'</section>';
    var last = SS.r>=c.rounds;
    h += '<button class="btn pri full" data-act="finishRound">'+(last ? (SS.ci+1<nC ? 'Finish circuit' : 'Finish and cool down') : 'Finish round')+'</button><p class="err">'+(ui.err||'')+'</p>';
  } else if(SS.ph==='rest'){
    var c2 = SS.circ[SS.ci], nextTxt, list = '';
    if(SS.restKind==='circuit'){
      nextTxt = 'Next: circuit '+(SS.ci+1)+', '+esc(c2.name.toLowerCase());
      list = '<ol class="nextl">'+c2.items.map(function(it){ return '<li>'+esc(EX[effKey(it.k)].n)+'</li>'; }).join('')+'</ol>';
    } else nextTxt = 'Next: round '+SS.r+' of '+c2.rounds;
    h += '<div class="rest"><p class="muted">Rest</p><p class="timer" id="rt">'+fmt((SS.restEnd-Date.now())/1000)+'</p><p>'+nextTxt+'</p>'+list
      + '<div class="btns"><button class="btn" data-act="add15">+15 sec</button><button class="btn pri" data-act="endRest">Skip rest</button></div>'
      + '<p class="muted small" style="margin-top:14px">Sip some water and breathe.</p></div>';
  } else if(SS.ph==='cool'){
    var cl = SS.kind==='period' ? PCOOL : COOL;
    h += '<section class="card">'+renderGuide(cl, COOL_SEC, 'Cool-down', 'Slow stretches to finish. Breathe deeply.', 'finishW', 'Finish workout')+'</section>';
  } else if(SS.ph==='done'){
    var min = Math.max(1, Math.round((Date.now()-SS.t0)/60000));
    h += '<section class="card"><h2 class="h2">Workout done</h2><p class="muted" style="margin-top:6px">That’s one more step. Showing up is what counts most.</p>'
      + '<div class="stat" style="margin:16px 0 0"><div class="mini"><p class="muted small">Time</p><p class="v">'+min+' min</p></div><div class="mini"><p class="muted small">Skipped</p><p class="v">'+(SS.skipEx.length+SS.skipCirc.length)+'</p></div></div>'
      + '<label class="fld" for="kcal">Calories burned (optional)</label><input id="kcal" type="number" inputmode="numeric" min="0" step="1" placeholder="kcal" style="width:120px">'
      + '<p class="muted small" style="margin-top:6px">From your watch or a cardio machine. Use it to compare your own workouts, not as a target.</p>'
      + '<button class="btn pri full" style="margin-top:16px" data-act="saveW">Save workout</button></section>';
  }
  return h;
}

function weekStart(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function dayStatus(list){ if(!list || !list.length) return ''; for(var i=0;i<list.length;i++){ if(list[i].st==='full') return 'full'; } return 'part'; }
function renderCal(){
  var y = cal.y, m = cal.m, first = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate(), today = ymd(new Date()), h = '';
  var ws = weekStart(new Date()), wc = 0;
  for(var i=0;i<7;i++){ var d = new Date(ws); d.setDate(ws.getDate()+i); wc += (S.hist[ymd(d)]||[]).length; }
  var mc = 0, mk = 0;
  for(var dd=1; dd<=n; dd++){ (S.hist[ymd(new Date(y,m,dd))]||[]).forEach(function(e){ mc++; mk += e.kcal||0; }); }
  h += '<header class="top"><h1 class="h1">Calendar</h1></header>';
  h += '<div class="stat"><div class="mini"><p class="muted small">This week</p><p class="v">'+wc+' of 5</p><div class="dots" aria-hidden="true">'+[0,1,2,3,4].map(function(j){ return '<span class="'+(j<wc?'on':'')+'"></span>'; }).join('')+'</div></div>'
    + '<div class="mini"><p class="muted small">'+MONTHS[m]+'</p><p class="v">'+mc+' workout'+(mc===1?'':'s')+'</p><p class="muted small">'+(mk ? mk.toLocaleString()+' kcal logged' : 'Cycle '+cycleNum()+' in progress')+'</p></div></div>';
  h += '<section class="card"><div class="mhd"><button class="ib" data-act="calPrev" aria-label="Previous month">'+I('left',22)+'</button><h3 style="margin:0">'+MONTHS[m]+' '+y+'</h3><button class="ib" data-act="calNext" aria-label="Next month">'+I('right',22)+'</button></div>';
  h += '<div class="cal">'+['Mo','Tu','We','Th','Fr','Sa','Su'].map(function(w){ return '<div class="dw">'+w+'</div>'; }).join('');
  for(var b=0;b<first;b++) h += '<div></div>';
  for(var day=1; day<=n; day++){
    var key = ymd(new Date(y,m,day)), list = S.hist[key], st = dayStatus(list), kc = 0;
    (list||[]).forEach(function(e){ kc += e.kcal||0; });
    h += '<button class="dc '+st+(key===today?' today':'')+(key>today?' fut':'')+(cal.sel===key?' sel':'')+'" data-act="day" data-d="'+key+'" aria-label="'+MONTHS[m]+' '+day+(st?', workout logged':'')+'"><span class="dn">'+day+'</span><span class="kc">'+(kc?kc:'')+'</span></button>';
  }
  h += '</div><div class="legend"><span><i style="background:var(--teal)"></i>Completed</span><span><i style="border:1.5px dashed var(--teal)"></i>Partly done</span><span><i style="box-shadow:0 0 0 2px var(--sun)"></i>Today</span><span style="color:var(--sun)">123 = kcal</span></div></section>';
  if(cal.sel){
    var sd = parseYmd(cal.sel), es = S.hist[cal.sel] || [];
    h += '<section class="card"><h3>'+longDate(sd)+'</h3>';
    if(!es.length) h += '<p class="muted">'+(cal.sel===today ? 'No workout yet today. Next up: workout '+(nextW()+1)+'.' : 'Rest day.')+'</p>';
    es.forEach(function(e, i){
      h += '<div class="entry'+(i===0?' first':'')+'"><p class="nm">'+esc(e.t)+'</p><p class="sub">'+e.min+' min, '+(e.st==='full'?'completed':'partly done')+'</p>'
        + (e.notes||[]).map(function(nt){ return '<p class="sub">'+esc(nt)+'</p>'; }).join('')
        + '<div class="krow"><label for="kc'+i+'">Calories</label><input id="kc'+i+'" type="number" inputmode="numeric" min="0" step="1" value="'+(e.kcal||'')+'" placeholder="kcal"><button class="btn sm" data-act="kcSave" data-i="'+i+'">Save</button></div></div>';
    });
    h += '</section>';
  }
  return h;
}

function renderSet(){
  var count = 0; Object.keys(S.hist).forEach(function(k){ count += S.hist[k].length; });
  var h = '<header class="top"><h1 class="h1">Settings</h1></header>';
  h += '<section class="card"><h3>Your progress</h3><p class="muted">Cycle '+cycleNum()+' of Phase 1, with '+count+' workout'+(count===1?'':'s')+' logged. Everything is saved only on this phone.</p></section>';
  h += '<section class="card"><h3>Back up</h3><p class="muted">Copy a backup code and keep it in your Notes app or email it to yourself. You can use it to restore your progress on a new phone.</p>'
    + '<div class="btns"><button class="btn sm" data-act="bkCopy">Copy backup code</button></div>'
    + (ui.code ? '<textarea readonly rows="4" style="margin-top:12px" aria-label="Backup code">'+esc(ui.code)+'</textarea><p class="muted small" style="margin-top:6px">If copying didn’t work, select the code above and copy it.</p>' : '')
    + '</section>';
  h += '<section class="card"><h3>Restore</h3><p class="muted">Paste a backup code to bring back your progress. This replaces what’s on this phone now.</p>'
    + '<textarea id="rs" rows="3" style="margin-top:12px" placeholder="Paste your backup code" aria-label="Backup code to restore">'+esc(ui.rsv||'')+'</textarea>'
    + '<div class="btns"><button class="btn sm" data-act="rsAsk">Restore</button></div>'
    + (ui.rsErr ? '<p class="err" style="text-align:left">'+ui.rsErr+'</p>' : '')
    + (ui.rsOk ? '<div class="panel" style="margin-left:0">Replace everything on this phone with this backup?<div class="btns"><button class="btn sm danger" data-act="rsYes">Replace</button><button class="btn sm" data-act="rsNo">Cancel</button></div></div>' : '')
    + '</section>';
  h += '<section class="card"><h3>Reset</h3><p class="muted">Deletes all workouts, weights, calendar history and progress on this phone. Use it after trying the app out.</p>'
    + '<div class="btns"><button class="btn sm out-bad" data-act="resetAsk">Reset everything</button></div>'
    + (ui.reset ? '<div class="panel" style="margin-left:0">Delete everything? This can’t be undone.<div class="btns"><button class="btn sm danger" data-act="resetYes">Delete everything</button><button class="btn sm" data-act="resetNo">Cancel</button></div></div>' : '')
    + '</section>';
  return h;
}

function render(){
  var app = $('app'), inSess = view==='sess' && SS;
  app.className = 'wrap' + (inSess ? ' sess' : '');
  app.innerHTML = inSess ? renderSess() : tab==='cal' ? renderCal() : tab==='set' ? renderSet() : renderHome();
  $('tabbar').classList.toggle('hide', !!inSess);
  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){ var on = tabs[i].getAttribute('data-tab')===tab; tabs[i].classList.toggle('on', on); if(on) tabs[i].setAttribute('aria-current','page'); else tabs[i].removeAttribute('aria-current'); }
}

/* ---------- session flow ---------- */
function allMarked(){ var c = SS.circ[SS.ci]; for(var i=0;i<c.items.length;i++){ var m = SS.m[i]; if(!m || (!m.d && !m.s)) return false; } return true; }
function startRest(sec, kind){ SS.ph = 'rest'; SS.restKind = kind; SS.restEnd = Date.now() + sec*1000; lastBeep = null; }
function finishRound(){
  if(!allMarked()){ ui.err = 'Tick or skip each exercise first'; render(); return; }
  TM = null; var c = SS.circ[SS.ci];
  if(SS.r < c.rounds){ SS.r++; SS.m = {}; startRest(c.rest, 'round'); }
  else if(SS.ci+1 < SS.circ.length){ SS.ci++; SS.r = 1; SS.m = {}; startRest(CIRCUIT_REST, 'circuit'); }
  else { SS.ph = 'cool'; GL = null; }
  ui = {}; persist(); render(); window.scrollTo(0,0);
}
function endRest(){ SS.ph = 'go'; ui = {}; persist(); render(); window.scrollTo(0,0); }
function skipCircuit(){
  TM = null; SS.skipCirc.push(SS.circ[SS.ci].name);
  if(SS.ci+1 < SS.circ.length){ SS.ci++; SS.r = 1; SS.m = {}; SS.ph = 'go'; } else { SS.ph = 'cool'; GL = null; }
  ui = {}; persist(); render(); window.scrollTo(0,0);
}
function saveWorkout(){
  var el = $('kcal'), kcal = el ? Math.max(0, Math.round(parseFloat(el.value)||0)) : 0;
  var d = ymd(new Date()), min = Math.max(1, Math.round((Date.now()-SS.t0)/60000)), notes = [], used = [];
  SS.circ.forEach(function(c){ if(c.cardio) return; c.items.forEach(function(it){ if(S.alt[it.k] && EX[it.k].alt){ var nm = EX[EX[it.k].alt].n; if(used.indexOf(nm)<0) used.push(nm); } }); });
  if(used.length) notes.push('Easier versions: '+used.join(', '));
  if(SS.skipEx.length) notes.push('Skipped: '+SS.skipEx.join(', '));
  if(SS.skipCirc.length) notes.push('Skipped circuits: '+SS.skipCirc.join(', '));
  var w = Object.keys(SS.wu).map(function(k){ return EX[k].n+' '+SS.wu[k]+' kg'; });
  if(w.length) notes.push('Weights: '+w.join(', '));
  var part = SS.kind==='low' || SS.kind==='period' || SS.skipEx.length || SS.skipCirc.length;
  (S.hist[d] = S.hist[d] || []).push({t:SS.title.charAt(0).toUpperCase()+SS.title.slice(1), k:SS.kind, min:min, kcal:kcal, st:part?'part':'full', notes:notes});
  if(SS.kind==='normal' || SS.kind==='comeback'){
    if(S.done.indexOf(SS.wi)<0) S.done.push(SS.wi);
    if(S.done.length >= WORKOUTS.length){ S.cycle++; S.done = []; S.flash = 'cycle'; }
  }
  SS = null; S.sess = null; save(); unwake(); view = 'tab'; tab = 'home'; ui = {}; GL = null; TM = null;
  render(); window.scrollTo(0,0); toast('Workout saved to your calendar');
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.hasAttribute('data-tab')){ tab = t.getAttribute('data-tab'); ui = {}; view = 'tab'; unwake(); render(); window.scrollTo(0,0); return; }
  var a = t.getAttribute('data-act'), i = t.hasAttribute('data-i') ? +t.getAttribute('data-i') : null;
  if(a==='loosen') return;
  if(t.tagName==='A') e.preventDefault();
  var m;
  switch(a){
    case 'start': startSess('normal', +t.getAttribute('data-w')); return;
    case 'comeback': startSess('comeback', nextW()); return;
    case 'low': startSess('low', nextW()); return;
    case 'period': startSess('period', nextW()); return;
    case 'choose': ui.choose = !ui.choose; break;
    case 'flashOk': S.flash = null; save(); break;
    case 'resume': ac(); view = 'sess'; ui = {}; wake(); break;
    case 'discardAsk': ui.discard = true; break;
    case 'discardNo': ui.discard = false; break;
    case 'discardYes': SS = null; S.sess = null; save(); ui = {}; TM = null; GL = null; toast('Workout discarded'); break;
    case 'leaveAsk': ui.leave = true; break;
    case 'leaveNo': ui.leave = false; break;
    case 'leaveYes': view = 'tab'; tab = 'home'; ui = {}; TM = null; unwake(); break;
    case 'ck': m = SS.m[i] = SS.m[i] || {}; m.d = !m.d; ui.err = ''; if(TM && TM.i===i) TM = null; break;
    case 'eye': ui.open = ui.open || {}; ui.open[i] = !ui.open[i]; break;
    case 'skip': ui.pn = ui.pn || {}; ui.pn[i] = !ui.pn[i]; break;
    case 'cancel': if(ui.pn) ui.pn[i] = false; break;
    case 'try': S.alt[SS.circ[SS.ci].items[i].k] = 1; save(); if(ui.pn) ui.pn[i] = false; SS.m[i] = {}; if(TM && TM.i===i) TM = null; break;
    case 'back': S.alt[SS.circ[SS.ci].items[i].k] = 0; save(); SS.m[i] = {}; if(TM && TM.i===i) TM = null; break;
    case 'any':
      var nm = EX[effKey(SS.circ[SS.ci].items[i].k)].n;
      SS.m[i] = {s:1}; SS.skipEx.push(nm); if(ui.pn) ui.pn[i] = false; if(ui.open) ui.open[i] = false; if(TM && TM.i===i) TM = null; ui.err = ''; break;
    case 'undo':
      var nm2 = EX[effKey(SS.circ[SS.ci].items[i].k)].n, ix = SS.skipEx.lastIndexOf(nm2);
      if(ix>=0) SS.skipEx.splice(ix,1); SS.m[i] = {}; break;
    case 'tm':
      ac();
      if(TM && TM.i===i){ TM = null; }
      else {
        var it = SS.circ[SS.ci].items[i], bx = EX[it.k], x = EX[effKey(it.k)], sec = (S.alt[it.k] && bx.altA) ? bx.altA : it.a;
        var total = x.side ? sec*2 : sec;
        TM = {i:i, end:Date.now()+total*1000, half:x.side ? Date.now()+sec*1000 : 0};
      }
      break;
    case 'finishRound': finishRound(); return;
    case 'skipCircAsk': ui.skipCirc = true; break;
    case 'skipCircNo': ui.skipCirc = false; break;
    case 'skipCircYes': skipCircuit(); return;
    case 'add15': SS.restEnd += 15000; persist(); break;
    case 'endRest': endRest(); return;
    case 'glStart':
      ac();
      var list = SS.ph==='loosen' ? LOOSEN : (SS.kind==='period' ? PCOOL : COOL), sec2 = SS.ph==='loosen' ? LOOSEN_SEC : COOL_SEC;
      if(GL && GL.list===list){ GL.run = true; GL.end = Date.now() + (GL.left || sec2*1000); }
      else GL = {list:list, sec:sec2, i:0, run:true, end:Date.now()+sec2*1000};
      break;
    case 'glPause': if(GL){ GL.left = Math.max(0, GL.end-Date.now()); GL.run = false; } break;
    case 'glNext': if(GL){ GL.i++; GL.left = 0; if(GL.i>=GL.list.length) GL.run = false; else GL.end = Date.now()+GL.sec*1000; } break;
    case 'toWorkout': SS.ph = 'go'; GL = null; persist(); break;
    case 'finishW': SS.ph = 'done'; GL = null; persist(); break;
    case 'saveW': saveWorkout(); return;
    case 'calPrev': cal.m--; if(cal.m<0){ cal.m = 11; cal.y--; } cal.sel = null; break;
    case 'calNext': cal.m++; if(cal.m>11){ cal.m = 0; cal.y++; } cal.sel = null; break;
    case 'day': cal.sel = t.getAttribute('data-d'); break;
    case 'kcSave':
      var inp = $('kc'+i), es = S.hist[cal.sel];
      if(es && es[i] && inp){ es[i].kcal = Math.max(0, Math.round(parseFloat(inp.value)||0)); save(); toast('Calories saved'); }
      break;
    case 'bkCopy':
      var code = '';
      try{ var d = JSON.parse(JSON.stringify(S)); d.sess = null; code = btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }catch(err){}
      ui.code = code;
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(function(){ toast('Backup code copied'); }).catch(function(){}); }
      break;
    case 'rsAsk':
      var raw = ($('rs')||{}).value || ''; ui.rsv = raw; ui.rsErr = ''; ui.rsOk = false;
      try{
        var data = JSON.parse(decodeURIComponent(escape(atob(raw.trim()))));
        if(!data || data.v!==1 || typeof data.hist!=='object' || !Array.isArray(data.done)) throw new Error('bad');
        ui.rsData = data; ui.rsOk = true;
      }catch(err){ ui.rsErr = 'That code doesn’t look right. Check that you copied the whole code.'; }
      break;
    case 'rsNo': ui.rsOk = false; break;
    case 'rsYes':
      S = Object.assign(fresh(), ui.rsData); S.sess = null; SS = null; save(); ui = {}; toast('Progress restored'); break;
    case 'resetAsk': ui.reset = true; break;
    case 'resetNo': ui.reset = false; break;
    case 'resetYes':
      S = fresh(); SS = null; TM = null; GL = null; save(); ui = {}; cal.sel = null; toast('Everything was reset'); break;
  }
  if(SS && (a==='ck'||a==='any'||a==='undo')) persist();
  render();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.getAttribute('data-act')==='loosen'){ S.loosen = t.checked; save(); return; }
  if(t.hasAttribute('data-wt')){
    var k = t.getAttribute('data-wt'), v = parseFloat(t.value);
    if(!isNaN(v) && v>=0){ S.wts[k] = v; if(SS){ SS.wu[k] = v; persist(); } save(); }
  }
});

/* ---------- timers ---------- */
setInterval(function(){
  var now = Date.now();
  if(SS && view==='sess' && SS.ph==='rest'){
    var left = Math.ceil((SS.restEnd-now)/1000), el = $('rt');
    if(left<=0){ beep(3, 988); endRest(); return; }
    if(el) el.textContent = fmt(left);
    if(left<=3 && lastBeep!==left){ lastBeep = left; beep(1, 660); }
  }
  if(TM && SS && view==='sess'){
    if(TM.half && now>=TM.half){ TM.half = 0; beep(2, 740); toast('Switch sides'); }
    var tl = (TM.end-now)/1000, tv = $('tmv');
    if(tl<=0){ var ii = TM.i; TM = null; SS.m[ii] = {d:1}; beep(2, 988); persist(); render(); }
    else if(tv) tv.textContent = fmt(tl);
  }
  if(GL && GL.run && SS && view==='sess'){
    var gl = (GL.end-now)/1000, gv = $('glv');
    if(gl<=0){ GL.i++; if(GL.i>=GL.list.length){ GL.run = false; beep(3, 988); } else { GL.end = now+GL.sec*1000; beep(1, 880); } render(); }
    else if(gv) gv.textContent = fmt(gl);
  }
}, 250);

/* ---------- offline support (only on your own website) ---------- */
try{
  if('serviceWorker' in navigator && /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
}catch(e){}

/* ---------- start ---------- */
if(SS && SS.ph==='rest' && SS.restEnd < Date.now()){ SS.ph = 'go'; persist(); }
render();
})();
</script>
</body>
</html>
